name: Forex Intraday — D1 H4 H1 M15

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: forex-intraday
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_GATEWAY_ID: default
  CLOUDFLARE_MODEL: '@cf/qwen/qwen3-30b-a3b-fp8'
  FOREX_CALENDAR_URL: 'https://nfs.faireconomy.media/ff_calendar_thisweek.json'
  FOREX_NEWS_BLOCK_MIN: '30'
  FOREX_MAX_ALERTS: '3'
  FOREX_COOLDOWN_MIN: '240'
  PYTHONUNBUFFERED: '1'

jobs:
  forex-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------------------ #
      # 1. Static validation
      # ------------------------------------------------------------------ #
      - name: Compile all Forex modules
        run: |
          python -m py_compile \
            forex_symbols.py \
            forex_quality.py \
            forex_ai_judge.py \
            forex_ai_selftest.py \
            forex_intraday_scanner.py \
            forex_intraday_scanner_v2.py \
            forex_intraday_scanner_v3.py \
            run_forex_v3.py run_forex_v4.py run_forex_v5.py run_forex_v6.py run_forex_v7.py \
            forex_market_data.py free_market_data.py \
            forex_preflight.py central_bank_rates.py telegram_signals.py
          echo "Compilation : OK"

      - name: Offline unit tests (symbols, coherence, medals, AI parsing)
        run: python -m unittest discover -s tests -v

      # ------------------------------------------------------------------ #
      # 2. Secrets — presence only, values never printed
      # ------------------------------------------------------------------ #
      - name: Verify required secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          fail=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret manquant : $name"
              fail=1
            else
              echo "$name : présent (valeur masquée)"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # ------------------------------------------------------------------ #
      # 3. Real Cloudflare Workers AI validation
      # ------------------------------------------------------------------ #
      - name: Cloudflare Workers AI self-test
        id: cfai
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python forex_ai_selftest.py

      - name: Report Cloudflare AI status
        run: |
          if [ "${{ steps.cfai.outcome }}" = "success" ]; then
            echo "Cloudflare AI : CONNECTÉ — la seconde opinion sera appliquée."
          else
            echo "::warning::Cloudflare AI indisponible — le moteur quantitatif continue seul (aucune contradiction ne sera déduite d'une panne)."
          fi

      # ------------------------------------------------------------------ #
      # 4. Preflight
      # ------------------------------------------------------------------ #
      - name: Forex preflight diagnostic
        id: preflight
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python forex_preflight.py

      # ------------------------------------------------------------------ #
      # 5. Production scanner
      # ------------------------------------------------------------------ #
      - name: Run Forex v7 production scanner
        id: scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python run_forex_v7.py

      # ------------------------------------------------------------------ #
      # 6. State + diagnostics
      # ------------------------------------------------------------------ #
      - name: Persist scanner state
        if: always()
        run: |
          if [ -f signal_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add signal_state.json
            if git diff --cached --quiet; then
              echo "État inchangé — aucun commit."
            else
              git commit -m 'chore: update forex scanner state [skip ci]'
              git push || echo "::warning::Push de l'état échoué (non bloquant)."
            fi
          else
            echo "Aucun signal_state.json à persister."
          fi

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Forex Intraday — résultat du run"
            echo ""
            echo "| Étape | Résultat |"
            echo "| --- | --- |"
            echo "| Cloudflare AI | ${{ steps.cfai.outcome }} |"
            echo "| Preflight | ${{ steps.preflight.outcome }} |"
            echo "| Scanner | ${{ steps.scanner.outcome }} |"
            echo ""
            echo "Zéro signal est un résultat valide : consulter le bloc DIAGNOSTIC FOREX V7 pour la cause exacte."
          } >> "$GITHUB_STEP_SUMMARY"
