name: Forex Intraday — D1 H4 H1 M15

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: forex-intraday
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forex-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Validate Forex scanners
        run: python -m py_compile forex_intraday_scanner.py forex_intraday_scanner_v2.py forex_intraday_scanner_v3.py run_forex_v3.py run_forex_v4.py run_forex_v5.py run_forex_v6.py run_forex_v7.py forex_preflight.py central_bank_rates.py telegram_signals.py
      - name: Forex preflight diagnostic
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOREX_NEWS_BLOCK_MIN: '30'
          FOREX_CALENDAR_URL: 'https://nfs.faireconomy.media/ff_calendar_thisweek.json'
        run: python forex_preflight.py
      - name: Run Forex v7 production scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOREX_MAX_ALERTS: '3'
          FOREX_COOLDOWN_MIN: '240'
          FOREX_NEWS_BLOCK_MIN: '30'
          FOREX_CALENDAR_URL: 'https://nfs.faireconomy.media/ff_calendar_thisweek.json'
        run: python run_forex_v7.py
      - name: Persist scanner state
        if: always()
        run: |
          if [ -f signal_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add signal_state.json
            git diff --cached --quiet || git commit -m 'chore: update forex scanner state [skip ci]'
            git push || true
          fi
