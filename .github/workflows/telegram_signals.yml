name: Trading Scanner — Telegram Signals (15min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: trading-scanner-15m
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Telegram connectivity diagnostic
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          if not token or not chat_id:
              raise SystemExit('TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID manquant dans GitHub Secrets')
          r = requests.get(f'https://api.telegram.org/bot{token}/getMe', timeout=15)
          r.raise_for_status()
          r = requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': '✅ Trading 212 Scanner : GitHub Actions + Telegram OK'}, timeout=15)
          r.raise_for_status()
          print('Telegram diagnostic OK')
          PY

      - name: Run Scanner V2 — macro + institutionnel + pré-breakout
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: '45'
          FINAL_MIN_SCORE: '60'
          WATCH_MIN_SCORE: '52'
          MAX_ALERTS: '5'
          WATCH_ALERTS: '3'
          ALERT_COOLDOWN_MIN: '60'
          WATCH_COOLDOWN_MIN: '180'
          RISK_PCT: '1.0'
        run: python scanner_v2.py

      - name: Persist scanner state
        if: always()
        run: |
          if [ -f signal_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add signal_state.json
            git diff --cached --quiet || git commit -m 'chore: update scanner state [skip ci]'
            git push || true
          fi