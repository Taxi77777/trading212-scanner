name: Trading Scanner — Daily + 1H Long Term

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: trading-scanner-daily-1h
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Validate scanner code
        run: python -m py_compile telegram_signals.py institutional_macro_scanner.py scanner_v2.py run_scanner_v2.py daily_1h_longterm_scanner.py run_daily_1h_hotfix.py expanded_universe.py

      - name: Telegram connectivity diagnostic
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          if not token or not chat_id:
              raise SystemExit('TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID manquant dans GitHub Secrets')
          r = requests.get(f'https://api.telegram.org/bot{token}/getMe', timeout=15)
          r.raise_for_status()
          r = requests.post(
              f'https://api.telegram.org/bot{token}/sendMessage',
              json={'chat_id': chat_id, 'text': '✅ Trading 212 Scanner Daily + 1H : Telegram OK'},
              timeout=15,
          )
          r.raise_for_status()
          print('Telegram diagnostic OK')
          PY

      - name: Run Daily master + 1H entry scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_CANDIDATE_MIN: '58'
          DAILY_FINAL_MIN: '64'
          MAX_ALERTS: '5'
          ALERT_COOLDOWN_MIN: '1440'
          RISK_PCT: '1.0'
        run: python run_daily_1h_hotfix.py

      - name: Persist scanner state
        if: always()
        run: |
          if [ -f signal_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add signal_state.json
            git diff --cached --quiet || git commit -m 'chore: update daily scanner state [skip ci]'
            git push || true
          fi
