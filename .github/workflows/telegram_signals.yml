name: Trading Scanner — Telegram Signals (15min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: trading-scanner-15m
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Evaluate macro regime
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python macro_engine.py
          cat macro.env >> "$GITHUB_ENV"

      - name: Run 15m market scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_ALERTS: '5'
          ALERT_COOLDOWN_MIN: '60'
          RISK_PCT: '1.0'
        run: python telegram_signals.py

      - name: Persist scanner state
        if: always()
        run: |
          if [ -f signal_state.json ] || [ -f macro_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add signal_state.json macro_state.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m 'chore: update scanner state [skip ci]'
            git push || true
          fi
