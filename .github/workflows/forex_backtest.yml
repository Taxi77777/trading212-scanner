name: Forex Backtest v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'forex_backtest_v1.py'
      - 'forex_intraday_scanner_v3.py'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip requests
      - name: Validate
        run: python -m py_compile forex_backtest_v1.py forex_intraday_scanner_v3.py
      - name: Run backtest
        run: python forex_backtest_v1.py
      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: forex-backtest-report
          path: backtest_results.json
          if-no-files-found: error
      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backtest_results.json
          git diff --cached --quiet || git commit -m 'chore: publish Forex backtest results [skip ci]'
          git push || true
