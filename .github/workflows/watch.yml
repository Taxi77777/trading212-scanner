name: Surveillance des plans

# Toutes les 30 minutes pendant les heures de bourse, du lundi au vendredi.
# 07h00-21h30 UTC couvre l'ouverture de Londres (07h00) jusqu'a la cloture de
# New York (20h00), avec de la marge. En dehors, les marches sont fermes : un
# passage n'apprendrait rien et couterait une requete pour rien.
on:
  schedule:
    - cron: "*/30 7-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Surveiller
        run: python run_watch.py

      # L'etat du suivi doit survivre d'un passage a l'autre, sinon un plan
      # deja declenche serait re-signale toutes les trente minutes.
      - name: Mémoriser l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "chore: état de la surveillance [skip ci]"
          git pull --rebase --autostash origin main
          git push
