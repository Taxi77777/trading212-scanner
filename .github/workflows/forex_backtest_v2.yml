name: Forex Backtest v2 — chaîne complète

on:
  workflow_dispatch:
  push:
    paths:
      - 'forex_backtest_v2.py'
      - 'forex_quality.py'
      - 'run_forex_v7.py'
      - '.github/workflows/forex_backtest_v2.yml'

permissions:
  contents: write

concurrency:
  group: forex-backtest-v2
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate
        run: python -m py_compile forex_backtest_v2.py forex_backtest_summary.py forex_intraday_scanner_v3.py forex_quality.py run_forex_v7.py
      - name: Run full-pipeline backtest
        env:
          PYTHONUNBUFFERED: '1'
        run: python forex_backtest_v2.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-backtest-v2-report
          path: backtest_results_v2.json
          if-no-files-found: warn
      - name: Persist report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backtest_results_v2.json
          git diff --cached --quiet || git commit -m 'chore: publish full-pipeline backtest results [skip ci]'
          git push || echo "::warning::push du rapport échoué (non bloquant)"
      - name: Summary
        if: always()
        run: python forex_backtest_summary.py
